name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The isolation guard's self-check. It plants one violation of each channel and
      # asserts the guard sees it, so a guard that silently stopped firing fails here
      # rather than the next time a run is dispatched.
      - run: npm test
